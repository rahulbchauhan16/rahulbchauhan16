<svg
  width="1200"
  height="250"
  viewBox="0 0 1200 250"
  xmlns="http://www.w3.org/2000/svg"
>
  <defs>

    <!-- Rainbow animated gradient -->
    <linearGradient id="rainbow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff0080">
        <animate
          attributeName="stop-color"
          values="#ff0080;#ff8c00;#ffff00;#00ff88;#00ffff;#0080ff;#8000ff;#ff0080"
          dur="8s"
          repeatCount="indefinite"
        />
      </stop>

      <stop offset="50%" stop-color="#00ffff">
        <animate
          attributeName="stop-color"
          values="#00ffff;#0080ff;#8000ff;#ff0080;#ff8c00;#ffff00;#00ff88;#00ffff"
          dur="8s"
          repeatCount="indefinite"
        />
      </stop>

      <stop offset="100%" stop-color="#8000ff">
        <animate
          attributeName="stop-color"
          values="#8000ff;#ff0080;#ff8c00;#ffff00;#00ff88;#00ffff;#0080ff;#8000ff"
          dur="8s"
          repeatCount="indefinite"
        />
      </stop>
    </linearGradient>

    <!-- Soft glow -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

  </defs>

  <!-- Background -->
  <rect
    width="1200"
    height="250"
    rx="15"
    fill="#1f2937"
  />

  <!-- Top decorative wave -->
  <path
    d="M0 15 Q300 45 600 15 T1200 15"
    fill="none"
    stroke="#00ffff"
    stroke-width="3"
    opacity="0.5"
  />

  <!-- Main Name -->
  <text
    x="600"
    y="145"
    text-anchor="middle"
    font-family="Arial, sans-serif"
    font-size="52"
    font-weight="bold"
    fill="url(#rainbow)"
    filter="url(#glow)"
  >
    Hi there 👋, I'm Rahul Chauhan
  </text>

  <!-- Bottom decorative wave -->
  <path
    d="M0 225 Q300 195 600 225 T1200 225"
    fill="none"
    stroke="#00ffff"
    stroke-width="3"
    opacity="0.5"
  />

</svg>
