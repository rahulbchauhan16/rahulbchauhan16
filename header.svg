<svg
  width="1200"
  height="250"
  viewBox="0 0 1200 250"
  xmlns="http://www.w3.org/2000/svg"
>

  <defs>

    <!-- Animated rainbow gradient for text -->
    <linearGradient id="rainbowText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffb703">
        <animate
          attributeName="stop-color"
          values="#ffb703;#00d4ff;#7b2cff;#ff3d71;#ffb703"
          dur="8s"
          repeatCount="indefinite"
        />
      </stop>

      <stop offset="50%" stop-color="#6366f1">
        <animate
          attributeName="stop-color"
          values="#6366f1;#d946ef;#ff3d71;#00d4ff;#6366f1"
          dur="8s"
          repeatCount="indefinite"
        />
      </stop>

      <stop offset="100%" stop-color="#ff3d71">
        <animate
          attributeName="stop-color"
          values="#ff3d71;#ffb703;#00d4ff;#7b2cff;#ff3d71"
          dur="8s"
          repeatCount="indefinite"
        />
      </stop>
    </linearGradient>

    <!-- Colorful background wave -->
    <linearGradient id="waveGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7b2cff"/>
      <stop offset="30%" stop-color="#00d4ff"/>
      <stop offset="55%" stop-color="#00e5a8"/>
      <stop offset="75%" stop-color="#d946ef"/>
      <stop offset="100%" stop-color="#ff3d71"/>
    </linearGradient>

    <!-- Second wave gradient -->
    <linearGradient id="waveGradient2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff3d71"/>
      <stop offset="35%" stop-color="#7b2cff"/>
      <stop offset="65%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#00e5a8"/>
    </linearGradient>

    <!-- Text glow -->
    <filter id="glow">
      <feGaussianBlur
        stdDeviation="3"
        result="blur"
      />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

  </defs>


  <!-- Main dark background -->
  <rect
    width="1200"
    height="250"
    rx="15"
    fill="#273244"
  />


  <!-- TOP COLORFUL FILLED WAVE -->
  <path
    d="
      M0,0
      L1200,0
      L1200,35
      C1000,10 850,25 700,30
      C500,40 350,55 0,25
      Z
    "
    fill="url(#waveGradient)"
    opacity="0.45"
  />


  <!-- SECOND TOP WAVE -->
  <path
    d="
      M0,0
      L1200,0
      L1200,15
      C900,30 650,5 400,25
      C200,40 100,15 0,10
      Z
    "
    fill="url(#waveGradient2)"
    opacity="0.35"
  />


  <!-- MAIN NAME -->
  <text
    x="600"
    y="145"
    text-anchor="middle"
    font-family="Arial, sans-serif"
    font-size="52"
    font-weight="bold"
    fill="url(#rainbowText)"
    filter="url(#glow)"
  >
    Hi there 👋, I'm Rahul Chauhan
  </text>


  <!-- BOTTOM COLORFUL FILLED WAVE -->
  <path
    d="
      M0,215
      C200,180 400,195 600,220
      C800,245 1000,245 1200,215
      L1200,250
      L0,250
      Z
    "
    fill="url(#waveGradient)"
    opacity="0.45"
  />


  <!-- SECOND BOTTOM WAVE -->
  <path
    d="
      M0,230
      C250,200 450,235 650,225
      C900,210 1050,240 1200,220
      L1200,250
      L0,250
      Z
    "
    fill="url(#waveGradient2)"
    opacity="0.35"
  />

</svg>
